[project]
name = "speleoconvert"
version = "0.1.0"
description = "Lossless Fountainware Compass to Ariane's Line survey converter"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Matt Hansen"}]
requires-python = ">=3.11"
dependencies = ["openspeleo-lib>=0.0.18", "pyproj>=3.6"]

[project.urls]
Repository = "https://github.com/hansen-matt/speleoconvert"

[project.scripts]
speleoconvert = "speleoconvert.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
